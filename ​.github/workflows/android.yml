name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project & Build APK
        run: |
          echo "📂 Checking repository contents..."
          ls -la
          
          # अगर ज़िप फाइल मौजूद है तो उसे अनजिप करें
          if [ -f "Gajidadaswitch.zip" ]; then
            sudo apt-get update && sudo apt-get install -y unzip
            echo "📦 Unzipping Gajidadaswitch.zip..."
            unzip -q Gajidadaswitch.zip -d extracted
          else
            echo "📁 No zip file found, looking in root..."
            mkdir -p extracted
            cp -r * extracted/ 2>/dev/null || true
          fi
          
          # ऑटोमैटिक रूप से उस फोल्डर को ढूंढें जिसमें gradlew मौजूद है
          echo "🔍 Searching for gradlew inside extracted files..."
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Error: gradlew file project me kahin nahi mili!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ Found gradlew at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "🛠️ Building APK..."
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
