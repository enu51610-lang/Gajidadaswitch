name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          echo "📂 Checking repository contents..."
          ls -la
          
          if [ -f "Gajidadaswitch.zip" ]; then
            sudo apt-get update && sudo apt-get install -y unzip
            echo "📦 Unzipping Gajidadaswitch.zip..."
            unzip -q Gajidadaswitch.zip -d extracted
            cd extracted
            cd $(ls -d */ | head -n 1)
          fi
          
          echo "🛠️ Building APK..."
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'