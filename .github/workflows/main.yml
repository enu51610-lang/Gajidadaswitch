name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          
          echo "📂 Listing all files in repository:"
          ls -la
          
          # रिपॉजिटरी में जो भी .zip फाइल होगी, यह उसे अपने आप ढूंढ कर अनजिप कर देगा
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Error: Koi bhi .zip file nahi mili repository me!"
            exit 1
          fi
          
          echo "📦 Found ZIP file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # प्रोजेक्ट के अंदर gradlew ढूंढें
          GRADLE_PATH=$(find extracted_project -name "gradlew" -maxdepth 4 | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "❌ Error: gradlew file zip ke andar nahi mili!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "🚀 Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
