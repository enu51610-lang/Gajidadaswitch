name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          
          # ज़िप फाइल को एक्सट्रेक्ट करें
          unzip -q Gajidadaswitch.zip -d extracted_project
          
          # फोल्डर के अंदर चेक करें कि gradlew कहाँ है और सीधे वहीं पहुँच जाएं
          cd extracted_project
          TARGET_DIR=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \;)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ Error: gradlew file nahi mili zip ke andar!"
            exit 1
          fi
          
          echo "📂 Found project in: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
