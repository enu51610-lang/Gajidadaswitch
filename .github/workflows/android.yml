name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure & Wrapper
        run: |
          echo "🛠️ Generating Android project structure..."
          
          mkdir -p GajiApp/app/src/main/java/com/gajidadaswitch/app
          mkdir -p GajiApp/app/src/main/res/layout
          mkdir -p GajiApp/gradle/wrapper

          # 1. build.gradle (project level)
          cat << 'EOF' > GajiApp/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 2. settings.gradle
          cat << 'EOF' > GajiApp/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GajiDadaSwitch"
          include ':app'
          EOF

          # 3. gradle-wrapper.properties
          cat << 'EOF' > GajiApp/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. सही gradlew और gradle-wrapper.jar सीधे गिटहब से डाउनलोड करें
          mkdir -p GajiApp/gradle/wrapper
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew > GajiApp/gradlew
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/subprojects/wrapper/src/main/resources/org/gradle/wrapper/gradle-wrapper.jar > GajiApp/gradle/wrapper/gradle-wrapper.jar
          chmod +x GajiApp/gradlew

          # 5. build.gradle (app level)
          cat << 'EOF' > GajiApp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.gajidadaswitch.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gajidadaswitch.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > GajiApp/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Gaji Dada Switch"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. activity_main.xml (डार्क थीम और डुअल IP बटन वाला लेआउट)
          cat << 'EOF' > GajiApp/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:background="#1E1E1E"
                  android:padding="12dp"
                  android:layout_marginBottom="10dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Gaji Dada Digital Switch"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginBottom="10dp"/>
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:weightSum="2">
                      <Button
                          android:id="@+id/btnApMode"
                          android:layout_width="0dp"
                          android:layout_height="48dp"
                          android:layout_weight="1"
                          android:text="AP Mode (192.168.4.1)"
                          android:textColor="#121212"
                          android:backgroundTint="#FFFFFF"
                          android:textStyle="bold"
                          android:textSize="12sp"
                          android:layout_marginEnd="6dp"/>
                      <Button
                          android:id="@+id/btnRouterMode"
                          android:layout_width="0dp"
                          android:layout_height="48dp"
                          android:layout_weight="1"
                          android:text="Router Mode"
                          android:textColor="#FFFFFF"
                          android:backgroundTint="#333333"
                          android:textStyle="bold"
                          android:textSize="12sp"
                          android:layout_marginStart="6dp"/>
                  </LinearLayout>
              </LinearLayout>

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#121212"/>
          </LinearLayout>
          EOF

          # 8. MainActivity.java (ऑटो-स्कैन और आईपी सेव करने वाला लॉजिक)
          cat << 'EOF' > GajiApp/app/src/main/java/com/gajidadaswitch/app/MainActivity.java
          package com.gajidadaswitch.app;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.IOException;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private Button btnApMode, btnRouterMode;
              private SharedPreferences sharedPreferences;
              private String apIpUrl = "http://192.168.4.1";
              private String savedRouterIp = "";
              private ExecutorService executorService;
              private Handler mainHandler;
              private boolean isScanning = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  btnApMode = findViewById(R.id.btnApMode);
                  btnRouterMode = findViewById(R.id.btnRouterMode);

                  sharedPreferences = getSharedPreferences("AppPrefs", MODE_PRIVATE);
                  savedRouterIp = sharedPreferences.getString("router_ip", "");

                  executorService = Executors.newFixedThreadPool(10);
                  mainHandler = new Handler(Looper.getMainLooper());

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }
                  });

                  loadUrlSafely(apIpUrl);
                  updateButtonStyles(true);

                  btnApMode.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          loadUrlSafely(apIpUrl);
                          updateButtonStyles(true);
                          Toast.makeText(MainActivity.this, "Connecting to AP Mode...", Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnRouterMode.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (isScanning) {
                              Toast.makeText(MainActivity.this, "Scanning is already running...", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          if (!savedRouterIp.isEmpty()) {
                              loadUrlSafely(savedRouterIp);
                              updateButtonStyles(false);
                              Toast.makeText(MainActivity.this, "Connecting to Saved Router IP...", Toast.LENGTH_SHORT).show();
                          } else {
                              startIpScanAndConnect();
                          }
                      }
                  });
                  
                  btnRouterMode.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          Toast.makeText(MainActivity.this, "Rescanning network for ESP32...", Toast.LENGTH_SHORT).show();
                          startIpScanAndConnect();
                          return true;
                      }
                  });
              }

              private void startIpScanAndConnect() {
                  isScanning = true;
                  btnRouterMode.setText("Scanning IP...");
                  Toast.makeText(this, "Searching for Gaji Dada Switch...", Toast.LENGTH_LONG).show();

                  executorService.execute(new Runnable() {
                      @Override
                      public void run() {
                          String foundIp = "";
                          String subnet = "192.168.1."; 
                          for (int i = 1; i <= 254; i++) {
                              if (!isScanning) break;
                              String testUrl = "http://" + subnet + i;
                              if (isDeviceGajiSwitch(testUrl)) {
                                  foundIp = testUrl;
                                  break;
                              }
                          }
                          final String finalIp = foundIp;
                          mainHandler.post(new Runnable() {
                              @Override
                              public void run() {
                                  isScanning = false;
                                  btnRouterMode.setText("Router Mode");
                                  if (!finalIp.isEmpty()) {
                                      savedRouterIp = finalIp;
                                      sharedPreferences.edit().putString("router_ip", savedRouterIp).apply();
                                      loadUrlSafely(savedRouterIp);
                                      updateButtonStyles(false);
                                      Toast.makeText(MainActivity.this, "Found & Saved: " + savedRouterIp, Toast.LENGTH_SHORT).show();
                                  } else {
                                      Toast.makeText(MainActivity.this, "ESP32 not found on network!", Toast.LENGTH_LONG).show();
                                  }
                              }
                          });
                      }
                  });
              }

              private boolean isDeviceGajiSwitch(String urlString) {
                  try {
                      URL url = new URL(urlString);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setConnectTimeout(300);
                      conn.setReadTimeout(300);
                      conn.setRequestMethod("GET");
                      if (conn.getResponseCode() == 200) {
                          return true;
                      }
                  } catch (IOException e) {}
                  return false;
              }

              private void loadUrlSafely(String url) {
                  if (!url.startsWith("http://") && !url.startsWith("https://")) {
                      url = "http://" + url;
                  }
                  webView.loadUrl(url);
              }

              void updateButtonStyles(boolean isApActive) {
                  if (isApActive) {
                      btnApMode.setBackgroundTintList(getResources().getColorStateList(android.R.color.white));
                      btnApMode.setTextColor(getResources().getColor(android.R.color.black));
                      btnRouterMode.setBackgroundTintList(getResources().getColorStateList(android.R.color.darker_gray));
                      btnRouterMode.setTextColor(getResources().getColor(android.R.color.white));
                  } else {
                      btnRouterMode.setBackgroundTintList(getResources().getColorStateList(android.R.color.white));
                      btnRouterMode.setTextColor(getResources().getColor(android.R.color.black));
                      btnApMode.setBackgroundTintList(getResources().getColorStateList(android.R.color.darker_gray));
                      btnApMode.setTextColor(getResources().getColor(android.R.color.white));
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # सीधे APK बिल्ड शुरू करें
          cd GajiApp
          echo "🛠️ Building APK..."
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GajiApp/build/outputs/apk/debug/*.apk
